<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Draft Era — NBA Drafting Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0A0D14;
    --bg-2: #0E121C;
    --panel: #141A26;
    --panel-2: #1B2230;
    --panel-3: #232C3D;
    --line: #2A3447;
    --line-soft: #20283655;
    --text: #F3F6FB;
    --muted: #93A0B7;
    --muted-2: #647189;
    --orange: #FF6A1A;
    --orange-deep: #E2540B;
    --blue: #2D8CFF;
    --blue-deep: #1B6FE0;
    --gold: #FFC53D;
    --green: #2BD576;
    --red: #FF6B5C;
    --display: 'Anton', sans-serif;
    --cond: 'Barlow Condensed', sans-serif;
    --body: 'Barlow', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  body {
    background:
      radial-gradient(1200px 700px at 50% -10%, #16203400, #0A0D14),
      repeating-linear-gradient(0deg, #0c1018 0 2px, #0a0d14 2px 4px);
  }

  #root { height: 100%; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--panel-3); border-radius: 10px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #2f3a50; }

  .mono-num { font-variant-numeric: tabular-nums; }

  /* ---------- App frame ---------- */
  .stage {
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #10151f, #0c1018);
    flex: 0 0 auto;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
  }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 9px;
    background: linear-gradient(135deg, var(--orange), var(--orange-deep));
    display: grid; place-items: center;
    box-shadow: 0 6px 18px -6px var(--orange-deep), inset 0 1px 0 #ffffff55;
    position: relative; overflow: hidden;
  }
  .brand-mark svg { width: 26px; height: 26px; }
  .brand-name {
    font-family: var(--display);
    font-size: 26px; letter-spacing: 0.5px; line-height: 0.9;
    text-transform: uppercase;
  }
  .brand-name .em { color: var(--orange); }
  .brand-sub {
    font-family: var(--cond); font-weight: 600; text-transform: uppercase;
    letter-spacing: 3px; font-size: 11px; color: var(--muted-2);
  }
  .live-pill {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--cond); font-weight: 700; text-transform: uppercase;
    letter-spacing: 1.5px; font-size: 12px; color: #fff;
    background: #c81f2d; padding: 5px 11px 4px; border-radius: 5px;
    box-shadow: 0 0 0 1px #ff5a5a44, 0 4px 14px -4px #c81f2d;
  }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: blink 1.4s infinite; }
  @keyframes blink { 0%, 60% { opacity: 1; } 80%, 100% { opacity: 0.25; } }

  .round-chip {
    font-family: var(--cond); font-weight: 600; text-transform: uppercase;
    letter-spacing: 2px; font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px 5px;
  }
  .round-chip b { color: var(--text); }

  /* ---------- Main 3-column body ---------- */
  .body-grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1fr 1.15fr 1fr;
    gap: 0; min-height: 0;
  }
  .col { min-height: 0; display: flex; flex-direction: column; }
  .col.center {
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    background: linear-gradient(180deg, #0d1119, #0a0d14);
  }

  /* ---------- Scoreboard / lineup column ---------- */
  .team-header {
    padding: 14px 18px 12px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--line);
    position: relative; overflow: hidden;
  }
  .team-header::before {
    content: ""; position: absolute; inset: 0;
    background: var(--accent); opacity: 0.10; z-index: 0;
  }
  .team-header.active::before { opacity: 0.22; }
  .team-header > * { position: relative; z-index: 1; }
  .team-header.active { box-shadow: inset 3px 0 0 var(--accent); }
  .col.p2 .team-header.active { box-shadow: inset -3px 0 0 var(--accent); }

  .gm-badge {
    width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center; flex: 0 0 auto;
    font-family: var(--display); font-size: 17px; color: #fff;
    background: var(--accent);
    box-shadow: inset 0 1px 0 #ffffff44, 0 4px 12px -4px #000;
  }
  .gm-meta { line-height: 1.05; min-width: 0; }
  .gm-name {
    font-family: var(--cond); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; font-size: 18px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .gm-label { font-family: var(--cond); font-weight: 600; text-transform: uppercase; letter-spacing: 2px; font-size: 10px; color: var(--muted-2); }
  .wins-box { margin-left: auto; text-align: right; line-height: 0.85; }
  .wins-num { font-family: var(--display); font-size: 34px; }
  .wins-cap { font-family: var(--cond); font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; font-size: 9px; color: var(--muted-2); }

  .lineup { padding: 8px 12px 12px; overflow-y: auto; flex: 1 1 auto; }
  .slot {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 11px; border-radius: 10px;
    border: 1px solid var(--line-soft);
    margin-top: 7px;
    background: linear-gradient(180deg, #161d2a, #121826);
    transition: border-color .15s, background .15s, transform .15s;
    position: relative;
  }
  .slot.empty { background: #0e131d; border-style: dashed; border-color: #283248; }
  .slot.target { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 22px -6px var(--accent); cursor: pointer; }
  .slot.target:hover { transform: translateX(2px); background: #18202e; }
  .col.p2 .slot.target:hover { transform: translateX(-2px); }
  .slot.justfilled { animation: pop .5s ease; }
  @keyframes pop { 0% { transform: scale(0.96); box-shadow: 0 0 0 2px var(--accent); } 100% { transform: scale(1); } }

  .slot-pos {
    width: 38px; height: 38px; flex: 0 0 auto; border-radius: 8px;
    display: grid; place-items: center;
    font-family: var(--display); font-size: 15px;
    background: #0c1119; color: var(--muted);
    border: 1px solid var(--line);
  }
  .slot.filled .slot-pos { background: var(--accent); color: #fff; border-color: transparent; }
  .slot-main { min-width: 0; flex: 1 1 auto; line-height: 1.1; }
  .slot-name { font-family: var(--cond); font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot-name.placeholder { color: var(--muted-2); font-weight: 600; }
  .slot-sub { font-size: 11px; color: var(--muted); font-family: var(--cond); font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; }
  .slot-grade { font-family: var(--display); font-size: 20px; flex: 0 0 auto; }
  .slot-era-badge {
    font-family: var(--cond); font-weight: 700; font-size: 10px; letter-spacing: 1px;
    color: #0a0d14; background: var(--accent); padding: 2px 6px; border-radius: 4px;
    flex: 0 0 auto;
  }

  /* ---------- Center column: reels + host ---------- */
  .center-inner { padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; height: 100%; overflow-y: auto; }

  .reel-card {
    border: 1px solid var(--line); border-radius: 16px;
    background: radial-gradient(120% 100% at 50% 0%, #1a2335, #10151f);
    padding: 18px; flex: 0 0 auto;
    box-shadow: 0 22px 50px -28px #000, inset 0 1px 0 #ffffff0f;
  }
  .reel-title { text-align: center; font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: 3px; font-size: 12px; color: var(--muted); margin-bottom: 14px; }

  .reels { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; }
  .reel {
    height: 118px; border-radius: 12px; overflow: hidden; position: relative;
    background: #07090e;
    border: 1px solid #2b3650;
    box-shadow: inset 0 0 26px #000, inset 0 0 0 1px #ffffff08;
  }
  .reel::before, .reel::after {
    content: ""; position: absolute; left: 0; right: 0; height: 38px; z-index: 3; pointer-events: none;
  }
  .reel::before { top: 0; background: linear-gradient(180deg, #07090e, #07090e00); }
  .reel::after { bottom: 0; background: linear-gradient(0deg, #07090e, #07090e00); }
  .reel-window {
    position: absolute; top: 50%; left: 8px; right: 8px; height: 46px; transform: translateY(-50%);
    border-top: 1px solid #ffffff14; border-bottom: 1px solid #ffffff14; z-index: 2; pointer-events: none;
    background: linear-gradient(180deg, #ffffff08, #ffffff00 40%, #00000022);
    border-radius: 6px;
  }
  .reel-strip { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
  .reel-item {
    height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px;
    font-family: var(--display); text-transform: uppercase; line-height: 1;
  }
  .reel-item .ri-abbr { font-size: 26px; }
  .reel-item .ri-city { font-family: var(--cond); font-weight: 700; font-size: 14px; color: var(--muted); letter-spacing: 0.5px; }
  .reel-item.decade { font-size: 30px; }
  .reel-swatch { width: 9px; height: 26px; border-radius: 3px; }

  .spin-row { display: flex; gap: 10px; margin-top: 16px; }
  .btn {
    font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;
    font-size: 15px; border: none; border-radius: 10px; padding: 13px 18px; cursor: pointer;
    color: #fff; transition: transform .1s, filter .15s, opacity .15s; display: inline-flex;
    align-items: center; justify-content: center; gap: 8px;
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-spin { flex: 1; background: linear-gradient(135deg, var(--orange), var(--orange-deep)); box-shadow: 0 10px 26px -10px var(--orange-deep); font-size: 17px; }
  .btn-ghost { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); }
  .btn-ghost:hover:not(:disabled) { background: var(--panel-3); }
  .btn-lifeline { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); flex: 1; }
  .btn-lifeline:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
  .btn-lifeline .ll-count { font-family: var(--body); font-weight: 700; font-size: 12px; opacity: .8; }

  .matchup-banner {
    text-align: center; padding: 10px 0 2px;
  }
  .matchup-banner .mb-label { font-family: var(--cond); font-weight: 600; text-transform: uppercase; letter-spacing: 2px; font-size: 11px; color: var(--muted-2); }
  .matchup-banner .mb-main { font-family: var(--display); font-size: 30px; text-transform: uppercase; line-height: 1; margin-top: 3px; }
  .matchup-banner .mb-accent { color: var(--accent); }

  /* ---------- Host ---------- */
  .host {
    border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
    padding: 14px 15px; display: flex; gap: 12px; flex: 0 0 auto;
    box-shadow: inset 0 1px 0 #ffffff0a;
  }
  .host-avatar {
    width: 44px; height: 44px; border-radius: 50%; flex: 0 0 auto;
    background: linear-gradient(135deg, #34405a, #1b2230);
    display: grid; place-items: center; border: 1px solid var(--line);
  }
  .host-avatar svg { width: 26px; height: 26px; }
  .host-body { min-width: 0; flex: 1; }
  .host-name { font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; font-size: 12px; color: var(--gold); display: flex; align-items: center; gap: 8px; }
  .host-text { font-size: 14.5px; line-height: 1.4; margin-top: 3px; color: #DCE3EF; }
  .host-grade-tag { margin-left: auto; font-family: var(--display); font-size: 22px; }

  /* ---------- Search panel ---------- */
  .search-wrap { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
  .search-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .search-title { font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-size: 15px; }
  .search-title .st-team { color: var(--accent); }
  .search-sub { font-family: var(--cond); font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; font-size: 10px; color: var(--muted-2); margin-top: 2px; }

  .search-controls { display: flex; gap: 8px; padding: 12px 16px; align-items: center; }
  .pos-filter { display: flex; gap: 4px; background: #0c1119; border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
  .pf-btn {
    font-family: var(--cond); font-weight: 700; font-size: 13px; text-transform: uppercase;
    border: none; background: transparent; color: var(--muted); padding: 6px 10px; border-radius: 6px; cursor: pointer;
    transition: background .12s, color .12s;
  }
  .pf-btn.active { background: var(--orange); color: #fff; }
  .search-input-wrap { position: relative; flex: 1; }
  .search-input {
    width: 100%; background: #0c1119; border: 1px solid var(--line); border-radius: 9px;
    color: var(--text); font-family: var(--body); font-size: 14px; padding: 10px 12px 10px 34px;
    outline: none; transition: border-color .15s;
  }
  .search-input:focus { border-color: var(--orange); }
  .search-input::placeholder { color: var(--muted-2); }
  .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted-2); width: 15px; height: 15px; }

  .player-list { flex: 1 1 auto; overflow-y: auto; padding: 4px 12px 16px; }
  .player-row {
    display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 11px;
    border: 1px solid transparent; cursor: pointer; transition: background .12s, border-color .12s;
  }
  .player-row:hover { background: #161e2b; border-color: var(--line); }
  .player-row.sel { background: #18222f; border-color: var(--orange); }
  .pr-pos { width: 34px; height: 34px; border-radius: 8px; flex: 0 0 auto; display: grid; place-items: center; font-family: var(--display); font-size: 13px; background: #0c1119; border: 1px solid var(--line); color: var(--muted); }
  .pr-main { min-width: 0; flex: 1; line-height: 1.12; }
  .pr-name { font-family: var(--cond); font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pr-meta { font-size: 11px; color: var(--muted); font-family: var(--cond); font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; }
  .pr-stats { display: flex; gap: 13px; flex: 0 0 auto; }
  .pr-stat { text-align: center; line-height: 1; }
  .pr-stat .v { font-family: var(--body); font-weight: 700; font-size: 14px; }
  .pr-stat .k { font-family: var(--cond); font-weight: 600; font-size: 9px; color: var(--muted-2); letter-spacing: 0.5px; margin-top: 2px; }
  .list-empty { text-align: center; color: var(--muted-2); font-family: var(--cond); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; padding: 40px 0; }
  .roster-count { font-family: var(--cond); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 11px; color: var(--muted-2); padding: 2px 16px 8px; }

  /* idle / waiting states in center */
  .center-idle { text-align: center; color: var(--muted-2); padding: 30px 16px; }
  .center-idle .big { font-family: var(--display); font-size: 22px; color: var(--muted); text-transform: uppercase; }

  /* ---------- Slot picker overlay ---------- */
  .picker-hint {
    font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    font-size: 12px; color: var(--gold); text-align: center; padding: 8px;
    border: 1px dashed var(--gold); border-radius: 9px; margin: 0 12px 4px;
    background: #FFC53D11;
  }

  /* ---------- Candidates modal (Narrow It Down) ---------- */
  .overlay {
    position: fixed; inset: 0; background: #05070bdd; z-index: 50;
    display: grid; place-items: center; padding: 24px; backdrop-filter: blur(3px);
    animation: fade .2s ease;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: min(640px, 100%); border: 1px solid var(--line); border-radius: 18px;
    background: var(--panel); padding: 22px; box-shadow: 0 40px 90px -30px #000;
  }
  .modal-title { font-family: var(--display); font-size: 24px; text-transform: uppercase; }
  .modal-sub { font-family: var(--cond); font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; font-size: 11px; color: var(--gold); margin-top: 2px; }
  .cand-grid { display: grid; gap: 10px; margin-top: 16px; }

  /* ---------- Game over ---------- */
  .gameover { width: min(720px, 100%); }
  .vs-final { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; margin: 18px 0; }
  .final-team { border: 1px solid var(--line); border-radius: 14px; padding: 18px; text-align: center; }
  .final-team.win { border-color: var(--gold); box-shadow: 0 0 30px -10px var(--gold); }
  .final-wins { font-family: var(--display); font-size: 56px; line-height: 0.9; }
  .final-rec { font-family: var(--cond); font-weight: 600; text-transform: uppercase; letter-spacing: 2px; font-size: 11px; color: var(--muted); }
  .vs-mid { font-family: var(--display); font-size: 22px; color: var(--muted-2); }

  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 60;
    background: var(--panel-2); border: 1px solid var(--gold); color: var(--gold);
    font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    font-size: 13px; padding: 9px 18px; border-radius: 8px; box-shadow: 0 14px 30px -10px #000;
    animation: fade .2s ease;
  }
  @media (max-width: 980px) {
    .body-grid { grid-template-columns: 1fr; grid-auto-rows: min-content; overflow-y: auto; }
    html, body { overflow: auto; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data/teams.js"></script>
<script src="data/players.js"></script>
<script src="src/scoring.js"></script>
<script type="text/babel" src="src/components.jsx"></script>
<script type="text/babel" src="src/app.jsx"></script>
</body>
